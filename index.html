
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Lector QR - Sistema de Asistencia
  </title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .tarjeta {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    #lectorQR {
      width: 100%;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #btnDetener {
      background: #dc2626;
      display: none;
    }

    .mensaje {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
    }

    .normal {
      background: #e5e7eb;
      color: #374151;
    }

    .exito {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .resultado {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #eff6ff;
      text-align: center;
      word-break: break-word;
    }

  </style>

</head>


<body>
<body>

<!-- =========================================
     LOGIN
========================================= -->

<div
  id="pantallaLogin"
  class="contenedor">

  <div class="tarjeta">

    <h1>
      Sistema de Asistencia
    </h1>

    <p style="text-align:center;">
      Acceso al lector QR
    </p>


    <label>
      Usuario
    </label>

    <input
      type="text"
      id="usuario"
      autocomplete="username"
      style="
        width:100%;
        padding:14px;
        margin-top:8px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
      "
    >


    <label
      style="
        display:block;
        margin-top:18px;
      "
    >
      Contraseña
    </label>

    <input
      type="password"
      id="password"
      autocomplete="current-password"
      style="
        width:100%;
        padding:14px;
        margin-top:8px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
      "
    >


    <button
      onclick="login()">

      INICIAR SESIÓN

    </button>


    <div
      id="mensajeLogin"
      class="mensaje normal">

      Ingresa tus datos para continuar.

    </div>

  </div>

</div>



<!-- =========================================
     LECTOR QR
========================================= -->

<div
  id="pantallaScanner"
  class="contenedor"
  style="display:none;">

  <div class="tarjeta">

    <h1>
      Lector QR
    </h1>

    <p
      style="text-align:center;"
      id="usuarioActual">
    </p>


    <button
      onclick="logout()"
      style="
        background:#6b7280;
      ">

      CERRAR SESIÓN

    </button>


    <div
      id="estado"
      class="mensaje normal">

      Pulsa "Iniciar cámara"

    </div>


    <div id="lectorQR"></div>


    <button
      id="btnIniciar"
      onclick="iniciarScanner()">

      INICIAR CÁMARA

    </button>


    <button
      id="btnDetener"
      onclick="detenerScanner()">

      DETENER CÁMARA

    </button>


    <div
      id="resultado"
      class="resultado">
    </div>

  </div>

</div>

  
<script>
  const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwc2DA6ba0kGgGgXtuoyfu2k_LFlH7DIw95IpGZdKxCkr9A9j9gW043qIPdF-LyZRQTQQ/exec';

  async function enviarAlServidor(datos) {

  try {

    const respuesta = await fetch(
      APPS_SCRIPT_URL,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },

        body: JSON.stringify(datos)
      }
    );


    const texto =
      await respuesta.text();


    console.log(
      'Respuesta Apps Script:',
      texto
    );


    return JSON.parse(texto);


  } catch (error) {

    console.error(
      'Error comunicando con Apps Script:',
      error
    );


    return {

      ok: false,

      mensaje:
        'No fue posible comunicarse con el servidor.'

    };

  }

}
async function probarConexionAppsScript() {

  const resultado =
    await enviarAlServidor({
      accion: 'PRUEBA'
    });

  console.log(
    'RESULTADO DE PRUEBA:',
    resultado
  );

  alert(
    JSON.stringify(resultado)
  );

}

  /************************************************
 * VARIABLES DE SESIÓN
 ************************************************/

let tokenSesion = null;

let usuarioSesion = null;


/************************************************
 * LOGIN
 ************************************************/

async function login() {

  const usuario =
    document
      .getElementById('usuario')
      .value
      .trim();


  const password =
    document
      .getElementById('password')
      .value;


  if (!usuario || !password) {

    mostrarMensajeLogin(
      'Debes ingresar usuario y contraseña.',
      'error'
    );

    return;

  }


  mostrarMensajeLogin(
    'Validando usuario...',
    'normal'
  );


  const respuesta =
    await enviarAlServidor({

      accion:
        'LOGIN_SCANNER',

      usuario:
        usuario,

      password:
        password

    });


  console.log(
    'Respuesta LOGIN:',
    respuesta
  );


  if (!respuesta || !respuesta.ok) {

    mostrarMensajeLogin(

      respuesta &&
      respuesta.mensaje
        ? respuesta.mensaje
        : 'No fue posible iniciar sesión.',

      'error'

    );

    return;

  }


  /*
   * Guardar sesión
   */

  tokenSesion =
    respuesta.token;

  usuarioSesion =
    respuesta.usuario;


  /*
   * Ocultar login
   */

  document
    .getElementById(
      'pantallaLogin'
    )
    .style.display =
      'none';


  /*
   * Mostrar scanner
   */

  document
    .getElementById(
      'pantallaScanner'
    )
    .style.display =
      'block';


  /*
   * Mostrar usuario
   */

  document
    .getElementById(
      'usuarioActual'
    )
    .innerHTML =

      '<strong>Usuario:</strong> ' +
      escaparHTML(
        usuarioSesion.nombre || ''
      ) +

      '<br>' +

      '<strong>Rol:</strong> ' +
      escaparHTML(
        usuarioSesion.rol || ''
      );


  mostrarEstado(
    'Sesión iniciada correctamente.',
    'exito'
  );

}


/************************************************
 * MENSAJE LOGIN
 ************************************************/

function mostrarMensajeLogin(
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      'mensajeLogin'
    );


  elemento.innerText =
    texto;


  elemento.className =
    'mensaje ' + tipo;

}


/************************************************
 * CERRAR SESIÓN
 ************************************************/

function logout() {

  tokenSesion = null;

  usuarioSesion = null;


  /*
   * Detener cámara si está activa
   */

  if (
    scannerQR &&
    scannerActivo
  ) {

    detenerScanner();

  }


  document
    .getElementById(
      'pantallaScanner'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'pantallaLogin'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'usuario'
    )
    .value = '';


  document
    .getElementById(
      'password'
    )
    .value = '';


  mostrarMensajeLogin(
    'Sesión cerrada.',
    'normal'
  );

}
  

let scannerQR = null;

let scannerActivo = false;

let ultimoCodigo = '';

let ultimoTiempo = 0;


/************************************************
 * INICIAR SCANNER
 ************************************************/

function iniciarScanner() {

  mostrarEstado(
    'Solicitando acceso a la cámara...',
    'normal'
  );


  if (scannerQR) {

    try {

      scannerQR.clear();

    } catch (error) {

      console.log(error);

    }

    scannerQR = null;

  }


  scannerQR =
    new Html5Qrcode(
      'lectorQR'
    );


  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  scannerQR.start(

    {
      facingMode: 'environment'
    },

    configuracion,

    function(decodedText) {

      procesarQR(decodedText);

    },

    function(errorMessage) {

      // Errores normales durante
      // la búsqueda del QR.
    }

  )

  .then(function() {

    scannerActivo = true;


    document
      .getElementById('btnIniciar')
      .style.display = 'none';


    document
      .getElementById('btnDetener')
      .style.display = 'block';


    mostrarEstado(
      'Cámara activa. Escanea el QR del alumno.',
      'exito'
    );

  })

  .catch(function(error) {

    console.error(
      'Error de cámara:',
      error
    );


    scannerActivo = false;


    mostrarEstado(
      'No fue posible acceder a la cámara: ' +
      error,
      'error'
    );

  });

}


/************************************************
 * PROCESAR QR
 ************************************************/

/************************************************
 * PROCESAR QR
 ************************************************/

async function procesarQR(codigo) {

  codigo =
    String(codigo || '')
      .trim();


  if (!codigo) {
    return;
  }


  /*
   * Verificar que exista sesión
   */

  if (!tokenSesion) {

    mostrarEstado(
      'La sesión ha expirado. Inicia sesión nuevamente.',
      'error'
    );

    return;

  }


  /*
   * Evitar lecturas repetidas
   */

  const ahora =
    Date.now();


  if (
    codigo === ultimoCodigo &&
    ahora - ultimoTiempo < 5000
  ) {

    return;

  }


  ultimoCodigo =
    codigo;

  ultimoTiempo =
    ahora;


  mostrarEstado(
    'QR detectado. Registrando asistencia...',
    'normal'
  );


  /*
   * Identificar dispositivo
   */

  const dispositivo =
    detectarDispositivo();


  /*
   * Enviar a Google Apps Script
   */

  const respuesta =
    await enviarAlServidor({

      accion:
        'REGISTRAR_ASISTENCIA',

      token:
        tokenSesion,

      codigoQR:
        codigo,

      dispositivo:
        dispositivo

    });


  console.log(
    'Respuesta asistencia:',
    respuesta
  );


  /*
   * Error de comunicación
   */

  if (!respuesta) {

    mostrarEstado(
      'No se recibió respuesta del servidor.',
      'error'
    );

    return;

  }


  /*
   * Sesión expirada
   */

  if (
    respuesta.mensaje &&
    respuesta.mensaje
      .toLowerCase()
      .includes('sesión')
  ) {

    mostrarEstado(
      respuesta.mensaje,
      'error'
    );

    return;

  }


  /*
   * Mostrar resultado
   */

  if (!respuesta.ok) {

    mostrarEstado(
      respuesta.mensaje ||
      'No fue posible registrar la asistencia.',
      'error'
    );


    mostrarResultadoAsistencia(
      respuesta
    );

    return;

  }


  /*
   * Registro exitoso
   */

  mostrarEstado(
    respuesta.mensaje,
    'exito'
  );


  mostrarResultadoAsistencia(
    respuesta
  );

}

/************************************************
 * DETECTAR DISPOSITIVO
 ************************************************/

function detectarDispositivo() {

  const agente =
    navigator.userAgent ||
    navigator.vendor ||
    window.opera;


  if (
    /android/i.test(agente)
  ) {

    return 'ANDROID';

  }


  if (
    /iPad|iPhone|iPod/i.test(agente)
  ) {

    return 'IOS';

  }


  if (
    /tablet/i.test(agente)
  ) {

    return 'TABLET';

  }


  return 'PC';

}

/************************************************
 * MOSTRAR RESULTADO ASISTENCIA
 ************************************************/

function mostrarResultadoAsistencia(
  respuesta
) {

  const resultado =
    document.getElementById(
      'resultado'
    );


  if (!resultado) {
    return;
  }


  resultado.style.display =
    'block';


  let titulo =
    'Resultado';


  if (
    respuesta.tipo ===
    'ENTRADA'
  ) {

    titulo =
      '✅ ENTRADA REGISTRADA';

  }


  if (
    respuesta.tipo ===
    'SALIDA'
  ) {

    titulo =
      '✅ SALIDA REGISTRADA';

  }


  if (
    respuesta.tipo ===
    'COMPLETA'
  ) {

    titulo =
      '⚠️ ASISTENCIA COMPLETA';

  }


  resultado.innerHTML =

    '<strong>' +
    titulo +
    '</strong>' +

    '<br><br>' +

    '<strong>Alumno:</strong><br>' +

    escaparHTML(
      respuesta.alumno || ''
    ) +

    '<br><br>' +

    '<strong>Hora:</strong><br>' +

    escaparHTML(
      respuesta.hora || ''
    ) +

    '<br><br>' +

    '<strong>Mensaje:</strong><br>' +

    escaparHTML(
      respuesta.mensaje || ''
    );

}
  
  
/************************************************
 * DETENER SCANNER
 ************************************************/

function detenerScanner() {

  if (
    !scannerQR ||
    !scannerActivo
  ) {

    return;

  }


  scannerQR
    .stop()

    .then(function() {

      scannerQR.clear();

      scannerActivo = false;


      document
        .getElementById('btnIniciar')
        .style.display = 'block';


      document
        .getElementById('btnDetener')
        .style.display = 'none';


      mostrarEstado(
        'Cámara detenida.',
        'normal'
      );

    })

    .catch(function(error) {

      console.error(
        error
      );

    });

}


/************************************************
 * MENSAJES
 ************************************************/

function mostrarEstado(
  texto,
  tipo
) {

  const elemento =
    document.getElementById(
      'estado'
    );


  elemento.innerText =
    texto;


  elemento.className =
    'mensaje ' + tipo;

}


/************************************************
 * SEGURIDAD HTML
 ************************************************/

function escaparHTML(
  texto
) {

  return String(
    texto || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

</script>

</body>

</html>
